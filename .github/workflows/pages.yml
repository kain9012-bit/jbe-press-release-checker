name: 페이지 배포

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "bench/**"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - "vite.config.ts"
      - "tsconfig.json"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    # 서버가 필요 없는 정적 화면이라 클라우드 러너로 충분하다.
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci
      # 규칙 사전과 hwpx 처리는 타입에 기대는 데가 많아 빌드 전에 한 번 걸러낸다.
      - run: npm run lint
      # 하네스. 키가 없어도 도는 것만 돌린다 — 골든 세트·단계별 규약·중계 서버의 문.
      - run: npm run bench

      - run: npm run build
        env:
          # 중계 서버 주소. 저장소 Variables 에 PROXY_URL 을 넣어 두면 여기로 들어온다.
          # 비밀이 아니라 그냥 주소다. 비어 있으면 각자 브라우저에 키를 넣는 방식으로 돈다.
          VITE_PROXY_URL: ${{ vars.PROXY_URL }}

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deploy
        uses: actions/deploy-pages@v4
