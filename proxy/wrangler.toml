name = "jbe-press-release-proxy"
main = "worker.js"
compatibility_date = "2026-08-01"

[vars]
# 이 웹페이지에서 오는 요청만 받는다. 쉼표로 여러 개를 적을 수 있다.
ALLOWED_ORIGINS = "https://kain9012-bit.github.io"

# 분당 횟수 제한. 한 사람이 검토 한 번에 세 번 부르므로 넉넉히 잡았다.
[[unsafe.bindings]]
name = "LIMITER"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 30, period = 60 }
